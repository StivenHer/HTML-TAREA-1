<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Stiven Hernandez">
  <meta name="keywords" content="registro, tienda, formulario, usuario">
  <meta name="description" content="Formulario de registro de usuarios en una tienda">
  <title>imagen11</title>
</head>
<body>
  <h1>Registro en nuestra tienda</h1>

  <form>
    <label for="usuario">Nombre de usuario</label><br>
    <input
      type="text"
      id="usuario"
      name="usuario"
      placeholder="Ej: luis"
    >

    <br><br>

    <label for="email">Email:</label><br>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Ej: luis@gmail.com"
    >

    <br><br>

    <label for="edad">Edad:</label><br>
    <input
      type="number"
      id="edad"
      name="edad"
      placeholder="Ej: 21"
    >

    <br><br>

    <label>Género:</label><br>
    <input
      type="radio"
      id="masculino"
      name="genero"
      value="masculino"
    >
    <label for="masculino">Masculino</label><br>

    <input
      type="radio"
      id="femenino"
      name="genero"
      value="femenino"
    >
    <label for="femenino">Femenino</label>

    <br><br>

    <label for="recomendado">Recomendado por:</label><br>
    <select id="recomendado" name="recomendado">
      <option value="google">Google</option>
      <option value="facebook">Facebook</option>
      <option value="amigo">Un amigo</option>
      <option value="otro">Otro</option>
    </select>

    <br><br>

    <label for="comentarios">Comentarios:</label><br>
    <textarea
      id="comentarios"
      name="comentarios"
      rows="3"
      cols="30"
    ></textarea>

    <br><br>

    <label for="terminos">Acepto terminos y condiciones:</label><br>
    <input
      type="checkbox"
      id="terminos"
      name="terminos"
    >

    <br><br>

    <button type="submit">Registrar</button>
  </form>
</body>
</html>
